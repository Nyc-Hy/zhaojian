name: 功能建议
description: 提出符合人本摄影原则的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 摄影场景与用户目标
      description: 说明谁在什么场景下想完成什么，而不是只给出实现方案。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前限制
      description: 当前流程为什么不能满足这个目标？
    validations:
      required: true
  - type: textarea
    id: possibilities
    attributes:
      label: 可考虑的方向
      description: 可以提供多个可能方案和取舍，不需要给唯一答案。
  - type: checkboxes
    id: boundaries
    attributes:
      label: 产品边界
      options:
        - label: 建议不会把摄影者降格为执行 AI 指令的工具。
          required: true
        - label: 建议不依赖上传未经授权的图片或个人数据。
          required: true
